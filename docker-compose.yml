# Pocket Alerts — one inbox for every alert, sent on to your phone (Go + SQLite). One container, one volume.
services:
  pocket-alerts:
    image: ghcr.io/abjelosevic88/pocket-homelab-alerts:latest
    container_name: pocket-alerts
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # The owner's own connections; everything can also be set under Settings.
      NOTIFY_URL: ${NOTIFY_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Who may send to and follow addresses on your own network (an ntfy or
      # Apprise next to this container): admins (default), all or none.
      # ALLOW_LOCAL_TARGETS: admins
      # Pocket Core: one sign-in and app links instead of tokens.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
