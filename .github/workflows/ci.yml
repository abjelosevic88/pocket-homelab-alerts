name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: Build web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Vet & test
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o pocket-alerts ./cmd/pocket-alerts
      - name: Smoke test
        run: |
          DATA_DIR=/tmp/pal DEMO_DATA=true AUTH_MODE=none ./pocket-alerts &
          sleep 2
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/v1/dashboard | grep -q '"unread"'
          curl -fsS http://localhost:8080/api/v1/sources | grep -q 'Uptime Kuma'
          curl -fsS "http://localhost:8080/api/v1/alerts?view=all" | grep -q 'Nightly backup finished'
          curl -fsS http://localhost:8080/api/v1/rules | grep -q 'Downloads: no sound'
          curl -fsS -H 'Title: Smoke' -d 'from CI' http://localhost:8080/smoke | grep -q '"event":"message"'
          curl -fsS "http://localhost:8080/api/v1/history?days=30" | grep -q '"days"'
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pocket-alerts:pr
